name: Build Windows Installer EXE

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build & Compile Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun (Fast & Native for bun.lock)
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js (Fallback Runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        shell: powershell
        run: |
          Write-Host "Memasang dependensi proyek..."
          try {
              bun install --frozen-lockfile
          } catch {
              Write-Warning "bun install --frozen-lockfile gagal, mencoba bun install..."
              try {
                  bun install
              } catch {
                  Write-Warning "bun install gagal, mencoba npm install --legacy-peer-deps..."
                  npm install --legacy-peer-deps
              }
          }

      - name: Build Web Application
        shell: powershell
        run: |
          Write-Host "Membangun bundle produksi aplikasi..."
          if (Get-Command bun -ErrorAction SilentlyContinue) {
              bun run build
          } else {
              npm run build
          }
          if (-not (Test-Path "dist\index.html")) {
              throw "Build gagal: dist\index.html tidak ditemukan!"
          }
          Write-Host "Build selesai: dist telah terverifikasi." -ForegroundColor Green

      - name: Install Inno Setup Compiler
        run: choco install innosetup -y --no-progress

      - name: Compile Windows Installer (.exe)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist-installer" | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) {
              $iscc = (Get-Command iscc.exe).Source
          }
          Write-Host "Mengompilasi installer dengan: $iscc"
          & "$iscc" installer.iss
          if (-not (Test-Path "dist-installer\DaysWinInstaller-Setup.exe")) {
              throw "Kompilasi installer gagal: DaysWinInstaller-Setup.exe tidak ditemukan!"
          }
          Write-Host "Kompilasi sukses! Berkas DaysWinInstaller-Setup.exe berhasil dibuat." -ForegroundColor Green

      - name: Upload Installer as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaysWinInstaller-Setup
          path: dist-installer/DaysWinInstaller-Setup.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Days WinInstaller v1.0.0 - Windows Setup"
          body: |
            ## 🚀 Days WinInstaller - Windows Installer (.exe)
            
            Installer resmi Windows untuk **Days WinInstaller**:
            
            - 📥 **[DaysWinInstaller-Setup.exe](https://github.com/sunaryo-harry/windows-installer/releases/download/v1.0.0/DaysWinInstaller-Setup.exe)**
            
            ### Cara Menggunakan:
            1. Unduh berkas **DaysWinInstaller-Setup.exe**.
            2. Klik ganda untuk memulai instalasi wizard Windows.
            3. Aplikasi otomatis terpasang ke Desktop dan Start Menu.
          draft: false
          prerelease: false
          make_latest: true
          files: dist-installer/DaysWinInstaller-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
