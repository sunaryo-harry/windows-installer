name: Build Windows Installer EXE

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build & Compile Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Install Inno Setup Compiler
        run: choco install innosetup -y --no-progress

      - name: Compile Windows Installer (.exe)
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) {
              $iscc = (Get-Command iscc.exe).Source
          }
          Write-Host "Mengompilasi installer dengan: $iscc"
          & "$iscc" installer.iss

      - name: Upload Installer as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaysWinInstaller-Setup
          path: dist-installer/DaysWinInstaller-Setup.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Days WinInstaller v1.0.0 - Windows Setup"
          body: |
            ## 🚀 Days WinInstaller - Windows Installer (.exe)
            
            Installer resmi Windows untuk **Days WinInstaller**:
            
            - 📥 **[DaysWinInstaller-Setup.exe](https://github.com/sunaryo-harry/windows-installer/releases/download/v1.0.0/DaysWinInstaller-Setup.exe)**
            
            ### Cara Menggunakan:
            1. Unduh berkas **DaysWinInstaller-Setup.exe**.
            2. Klik ganda untuk memulai instalasi wizard Windows.
            3. Aplikasi otomatis terpasang ke Desktop dan Start Menu.
          draft: false
          prerelease: false
          files: dist-installer/DaysWinInstaller-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
